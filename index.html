<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACGHMT｜港・澳・台・深 動漫遊戲同人活動雷達</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div>
        <h1 class="text-xl font-bold tracking-wide text-indigo-400">ACGHMT 活動雷達</h1>
        <p class="text-xs text-slate-400">香港・澳門・台灣・深圳 動漫／遊戲／同人／快閃每日情報</p>
      </div>
      <div id="last-updated" class="text-xs text-slate-400">資料載入中...</div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <!-- 篩選區 -->
    <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6 space-y-4">
      <div class="flex flex-wrap gap-2 items-center">
        <span class="text-xs font-semibold text-slate-400 mr-1">地區：</span>
        <button data-region="ALL" class="region-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-600 text-white">全部四地</button>
        <button data-region="香港" class="region-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">🇭🇰 香港</button>
        <button data-region="澳門" class="region-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">🇲🇴 澳門</button>
        <button data-region="台灣" class="region-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">🇹🇼 台灣</button>
        <button data-region="深圳" class="region-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">🇨🇳 深圳</button>
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <select id="category-filter" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
          <option value="ALL">所有活動類型</option>
          <option value="同人即賣會">同人即賣會 / ONLY</option>
          <option value="綜合漫展">綜合漫展</option>
          <option value="遊戲與快閃">遊戲線下 / 主題快閃</option>
        </select>
        <input id="search-input" type="text" placeholder="搜尋活動名稱、場館、作品或標籤..."
          class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500" />
      </div>
    </section>

    <!-- 活動列表 -->
    <section id="events-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></section>
  </main>

  <script>
    let allEvents = [];
    let selectedRegion = "ALL";

    const regionColors = {
      "香港": "bg-rose-500/20 text-rose-300 border-rose-500/40",
      "澳門": "bg-emerald-500/20 text-emerald-300 border-emerald-500/40",
      "台灣": "bg-sky-500/20 text-sky-300 border-sky-500/40",
      "深圳": "bg-amber-500/20 text-amber-300 border-amber-500/40"
    };

    async function loadEvents() {
      try {
        const res = await fetch("./data/events.json?t=" + Date.now());
        const data = await res.json();
        document.getElementById("last-updated").textContent = "最後更新：" + (data.last_updated || "剛剛");
        allEvents = (data.events || []).sort((a, b) => a.start_date.localeCompare(b.start_date));
        renderEvents();
      } catch (e) {
        document.getElementById("events-grid").innerHTML = `<p class="text-slate-400">暫時無法載入活動資料，請稍後再試。</p>`;
      }
    }

    function renderEvents() {
      const category = document.getElementById("category-filter").value;
      const keyword = document.getElementById("search-input").value.trim().toLowerCase();
      const grid = document.getElementById("events-grid");

      const filtered = allEvents.filter(ev => {
        const matchRegion = selectedRegion === "ALL" || ev.region === selectedRegion;
        const matchCat = category === "ALL" || ev.category === category;
        const text = `${ev.title} ${ev.venue} ${(ev.tags || []).join(" ")} ${ev.deadline_note || ""}`.toLowerCase();
        const matchKey = !keyword || text.includes(keyword);
        return matchRegion && matchCat && matchKey;
      });

      if (!filtered.length) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">找不到符合條件的活動，試試切換地區或關鍵字。</div>`;
        return;
      }

      grid.innerHTML = filtered.map(ev => {
        const badgeStyle = regionColors[ev.region] || "bg-slate-700 text-slate-200";
        const dateStr = ev.start_date === ev.end_date ? ev.start_date : `${ev.start_date} ～ ${ev.end_date}`;
        const tagsHtml = (ev.tags || []).map(t => `<span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">#${t}</span>`).join(" ");
        return `
          <article class="bg-slate-900 border border-slate-800 hover:border-indigo-500/60 transition rounded-xl p-5 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded border ${badgeStyle}">${ev.region}</span>
                <span class="text-xs text-slate-400">${ev.category}</span>
              </div>
              <h2 class="text-lg font-bold text-slate-100 mb-2 leading-snug">${ev.title}</h2>
              <div class="space-y-1 text-sm text-slate-300 mb-3">
                <p>📅 <span class="font-medium text-indigo-300">${dateStr}</span></p>
                <p>📍 ${ev.venue}</p>
                ${ev.deadline_note ? `<p class="text-amber-300 text-xs mt-1">⏰ ${ev.deadline_note}</p>` : ""}
              </div>
              <div class="flex flex-wrap gap-1.5 mb-4">${tagsHtml}</div>
            </div>
            <a href="${ev.url}" target="_blank" rel="noopener noreferrer"
              class="inline-block text-center w-full py-2 rounded-lg bg-slate-800 hover:bg-indigo-600 text-sm font-medium transition">
              查看官方詳情 ↗
            </a>
          </article>
        `;
      }).join("");
    }

    document.querySelectorAll(".region-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedRegion = btn.dataset.region;
        document.querySelectorAll(".region-btn").forEach(b => {
          b.className = "region-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700";
        });
        btn.className = "region-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-600 text-white";
        renderEvents();
      });
    });

    document.getElementById("category-filter").addEventListener("change", renderEvents);
    document.getElementById("search-input").addEventListener("input", renderEvents);
    loadEvents();
  </script>
</body>
</html>
