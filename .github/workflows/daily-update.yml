name: Daily ACG Events Update

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 00:00 = 香港/台灣/澳門/深圳 08:00
  workflow_dispatch: # 允許在 GitHub Actions 頁面手動點選立即執行

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AI event updater
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python scripts/update_events.py

      - name: Commit and push updated data/events.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/events.json
          if git diff --staged --quiet; then
            echo "No changes to data/events.json"
          else
            git commit -m "chore: daily update events.json [skip ci]"
            git push
          fi
